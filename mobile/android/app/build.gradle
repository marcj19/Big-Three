plugins {
    id 'com.android.application' version '8.13.1'
}

def bigThreeVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json')).version
def parts = bigThreeVersion.split(/[.]/).collect { it.toInteger() }
if (parts.size() != 3 || parts.any { it < 0 || it > 999 }) throw new GradleException('Expected a stable Big Three version with components below 1000.')

android {
    namespace 'com.marcj19.bigthree.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.marcj19.bigthree.mobile'
        minSdk 26
        targetSdk 36
        versionCode parts[0] * 1_000_000 + parts[1] * 1_000 + parts[2]
        versionName bigThreeVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def brand = layout.buildDirectory.dir('generated/brand')
android.sourceSets.main.res.srcDir(brand)
tasks.register('copyBrand', Copy) {
    from '../../../packages/app/assets/icon.png'
    into brand.map { it.dir('drawable-nodpi') }
    rename { 'big_three.png' }
}
tasks.named('preBuild') { dependsOn 'copyBrand' }

def officeSource = rootProject.file('office')
def officeAssets = layout.buildDirectory.dir('generated/office')
android.sourceSets.main.assets.srcDir(officeAssets)
tasks.register('buildOffice', Exec) {
    inputs.dir officeSource
    inputs.dir rootProject.file('../../packages/app/src/renderer')
    inputs.dir rootProject.file('../../packages/app/src/shared')
    inputs.file rootProject.file('../../package-lock.json')
    outputs.dir officeAssets
    commandLine 'node', new File(officeSource, 'build.mjs').absolutePath, officeAssets.get().asFile.absolutePath
}
tasks.named('preBuild') { dependsOn 'buildOffice' }

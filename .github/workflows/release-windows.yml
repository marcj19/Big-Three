name: Release Windows installer

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $root = Get-Content package.json -Raw | ConvertFrom-Json
          $app = Get-Content packages/app/package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$($app.version)" -or $root.version -ne $app.version) {
            throw 'The stable release tag and both package versions must match.'
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:installer
      - name: Publish the installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $setup = "dist/installer/Big-Three-Setup-$version-x64.exe"
          $assets = @($setup, "$setup.blockmap", 'dist/installer/latest.yml')
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset $asset" }
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Big Three $env:GITHUB_REF_NAME" --latest
